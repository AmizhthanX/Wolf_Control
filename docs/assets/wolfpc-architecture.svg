<rect x="803" y="139" width="355" height="156" rx="16" fill="#142035" stroke="#35475f" stroke-width="2"/>
<text x="828" y="179" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#51d8c5">ESP32 + RELAYS</text>
<text x="828" y="221" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#e8eef9">POWER ON / HARD RESET</text>
<text x="828" y="256" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#aebed5">Dry contacts act like case buttons</text>
<rect x="803" y="346" width="355" height="142" rx="16" fill="#142035" stroke="#35475f" stroke-width="2"/>
<text x="828" y="383" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#51d8c5">WINDOWS AGENT + WOLF TILE</text>
<text x="828" y="426" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#e8eef9">SHUTDOWN / RESTART / LOCK</text>
<text x="828" y="461" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#aebed5">Phone sign-in and session status</text>
<rect x="40" y="521" width="1118" height="48" rx="12" fill="#1a2a3c"/>
<text x="65" y="551" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#e8eef9">Physical fallback: the case Power / Reset buttons and Windows password tile remain available.</text>
