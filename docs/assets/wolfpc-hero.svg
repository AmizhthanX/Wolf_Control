<text x="60" y="148" font-family="Segoe UI,Arial,sans-serif" font-size="49" font-weight="700" fill="#e8eef9">Your PC. One tap away.</text>
<text x="64" y="198" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#aebed5">Power it on. Lock it. Sign in with your phone.</text>
