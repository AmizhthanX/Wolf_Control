; WolfPC controller — ESP32 + 2-channel relay
;
;   pio run                 build
;   pio run -t upload       flash
;   pio device monitor      serial console (115200)
;
; Copy include/credentials.example.h to include/credentials.h first; the real
; file is gitignored.

[env:esp32dev]
platform      = espressif32@^6.9.0
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

lib_deps =
  bblanchon/ArduinoJson@^7.2.1

build_flags =
  -DWOLF_FIRMWARE_VERSION='"1.0.1"'
  -DCORE_DEBUG_LEVEL=1
  -std=gnu++17

build_unflags = -std=gnu++11

; A relay pulse is not idempotent, so a firmware that silently truncates a
; string or overruns a buffer is a firmware that can boot the machine at random.
; Warnings stay loud.
build_src_flags =
  -Wall
  -Wextra
  -Wno-unused-parameter

board_build.partitions = min_spiffs.csv
